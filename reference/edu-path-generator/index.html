<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>AI Learning Path Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Critical first-paint CSS to avoid UA defaults and font flashes */
      html, body { height: 100%; }
      body { margin: 0; background: #ffffff; color: #0b0c18; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif; font-weight: 300; }
      #root, #portal-root { isolation: isolate; }
    </style>

    <!-- Primary Meta Tags -->
    <meta name="title" content="AI Learning Path Generator">
    <meta name="description" content="Open-source AI learning platform that generates personalized, project-based learning pathways for any skill with adaptive AI guidance and progress tracking.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/Enterprise-DNA-OS/ai-learning-path-generator">
    <meta property="og:title" content="AI Learning Path Generator">
    <meta property="og:description" content="Open-source AI learning platform that generates personalized, project-based learning pathways for any skill with adaptive AI guidance and progress tracking.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://github.com/Enterprise-DNA-OS/ai-learning-path-generator">
    <meta property="twitter:title" content="AI Learning Path Generator">
    <meta property="twitter:description" content="Open-source AI learning platform that generates personalized, project-based learning pathways for any skill with adaptive AI guidance and progress tracking.">

    <!-- Theme Color -->
    <meta name="theme-color" content="#6654f5">
</head>
<body>
    <div id="root"></div>
    <div id="portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
